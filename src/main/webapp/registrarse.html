<!DOCTYPE html>
<html>
<head>
    <title>Registro - ProvitalSST</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="icon" type="image/png" href="imagenes/logo-entero.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #67AD5E, #066b3e);
}


/* FORMULARIO */

.form-register{

    width:400px;
    min-height:600px;

    margin:70px auto;

    padding:30px;

    background: rgba(37, 35, 35, 0.95);
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);

    border-radius:10px;


}


h1{

    text-align:center;
    color:white;
    margin-bottom:10px;

}


p{

    color:#ddd;
    text-align:center;
    margin-bottom:20px;

}


/* CAMPOS */

.controls{

    width:100%;
    height:42px;

    margin-bottom:18px;

    padding:0 15px;

    background:#252323;

    border:1px solid #066b3e;

    border-radius:6px;

    color:white;

    font-size:15px;

    font-weight:bold;

    outline:none;

}


.controls:focus{

    border-color:#67AD5E;

    box-shadow:0 0 8px #67AD5E;

}


/* LABEL */

label{

    display:block;

    color:white;

    margin-bottom:7px;

    font-weight:bold;

}


/* SELECT */

select.controls{

    cursor:pointer;

}


select.controls option{

    background:#252323;

    color:white;

}


/* BOTON */

.btn-register{

    width:100%;

    height:42px;

    background:#066b3e;

    border:none;

    border-radius:6px;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}


.btn-register:hover{

    background:#67AD5E;

}


/* LINK */

.login{

    text-align:center;

    margin-top:20px;

}


.login a{

    color:#67AD5E;

    text-decoration:none;

}


</style>

</head>


<body>


<form class="form-register" action="RegistrarUsuario" method="POST">


<h1>Crear cuenta</h1>

<p>Complete sus datos para registrarse</p>


<label for="nombre">Nombre</label>
<input class="controls" 
       type="text" 
       name="nombre" 
       id="nombre"
       placeholder="Ingrese su nombre"
       required>


<label for="apellido">Apellido</label>
<input class="controls" 
       type="text" 
       name="apellido" 
       id="apellido"
       placeholder="Ingrese su apellido"
       required>


<label for="cedula">Cédula</label>
<input class="controls" 
       type="text" 
       name="cedula" 
       id="cedula"
       placeholder="Ingrese su cédula"
       required>


<label for="correo">Correo</label>
<input class="controls" 
       type="email" 
       name="correo" 
       id="correo"
       placeholder="Ingrese su correo"
       required>


<label for="rol">Rol</label>

<select class="controls" name="rol" id="rol" required>

<option value="" disabled selected>
Seleccione un rol
</option>

<option value="admin">
Administrador
</option>

<option value="medico">
Médico
</option>

<option value="asegurado">
Asegurado
</option>

</select>



<label for="clave">Contraseña</label>

<input class="controls"
       type="password"
       name="clave"
       id="clave"
       placeholder="Ingrese una contraseña"
       required>



<label for="confirmar">Confirmar contraseña</label>

<input class="controls"
       type="password"
       name="confirmar"
       id="confirmar"
       placeholder="Repita la contraseña"
       required>



<button class="btn-register" type="submit">
Registrarse
</button>



<div class="login">

<p>
¿Ya tienes una cuenta?
<a href="index.html">
Inicia sesión
</a>
</p>

</div>


</form>


</body>
</html>
